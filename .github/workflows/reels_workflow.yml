name: Generate and Send Reels

on:
  schedule:
    - cron: '0 15 * * *'  # Cada dia a les 15:00 UTC (17:00 hora catalana)
  workflow_dispatch:

permissions:
  contents: write           # Permís per fer git push del vídeo i el CSV

jobs:
  generate-and-send-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instal·lar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instal·lar Dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_and_send_reels.py
