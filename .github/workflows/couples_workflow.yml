name: Generate and Post Couples Carousels

on:
  workflow_dispatch: # Permet executar-lo manualment des del botó "Run workflow" de GitHub
  schedule:
    - cron: '0 7 * * *'   # S'executa a les 07:00 UTC (09:00h hora catalana)
    - cron: '0 11 * * *'  # S'executa a les 11:00 UTC (13:00h hora catalana)
    - cron: '0 15 * * *'  # S'executa a les 15:00 UTC (17:00h hora catalana)
    - cron: '0 19 * * *'  # S'executa a les 19:00 UTC (21:00h hora catalana)

permissions:
  contents: write # Permís imprescindible per poder fer commit i guardar el posts.csv i les imatges

jobs:
  generate-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessari per fer git commit/push sense errors de repositori superficial

      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: ⚙️ Instal·lar Dependències
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🚀 Executar Script de Generació i Enviament
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_and_send_couples.py
